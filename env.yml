name: force_estimation
channels:
  - defaults
dependencies:
  - matplotlib
  - numpy=1 # Some modules require numpy 1.x
  - pandas
  - pillow
  - pip
  - plotly
  - python=3.9.18
  - scikit-learn
  - tqdm
  - pip:
      - torch==2.2.1
      - torchvision==0.17.1
      - tensorboard
      - openpyxl
      - wandb

# Create the environment with conda or miniconda depending on your setup
prefix: /home/$USER/miniconda3/envs/force_estimation
